name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble site
        run: |
          ./scripts/build-site.sh /tmp/site
          test -f /tmp/site/index.html
          test -f /tmp/site/brand/tokens.css

      - name: Check DESIGN.md structure
        run: |
          ruby -ryaml -e '
            text = File.read("DESIGN.md")
            fm = text.split("---")[1]
            keys = YAML.safe_load(fm).keys
            allowed = %w[name description colors typography rounded spacing components]
            extra = keys - allowed
            abort("DESIGN.md frontmatter has unsupported keys: #{extra}") unless extra.empty?
            %w[Overview Colors Typography Elevation Components].each do |h|
              abort("DESIGN.md missing section: #{h}") unless text =~ /^## (\d+\. )?#{h}/
            end
            abort("DESIGN.md missing section: Do'"'"'s and Don'"'"'ts") unless text =~ /^## (\d+\. )?Do.s and Don.ts/
            puts "DESIGN.md ok"
          '

  # The website deploys to Railway only from main, only after build passes, and
  # only when something the site is made of changed. RAILWAY_TOKEN is a
  # project token scoped to the production environment.
  deploy-site:
    name: deploy-site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    environment:
      name: production
      url: https://unotch.sethmedina.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the site changed
        id: site
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" \
             | grep -qE '^(site/|brand/|scripts/build-site\.sh$|railway\.json$|\.dockerignore$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No site-related changes; skipping deploy."
          fi

      - name: Install Railway CLI
        if: steps.site.outputs.changed == 'true'
        run: npm install -g @railway/cli@4

      - name: Deploy to Railway
        if: steps.site.outputs.changed == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service site --environment production
